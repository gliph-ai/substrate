# Pushleft CI standard (docs: pushleft ci-pipelines). Every push runs the fast
# Rust tests. On main, build:production builds and holds the release next to
# the tests; deploy:production makes that commit live once they pass.
# PUSHLEFT_TOKEN: admin service token of org gliph, a secret of the
# `production` environment (main only). A token names its org: no --org.
name: ci

on:
  push:
    branches: ['**']   # branches only; tags belong to release.yml
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  PL_GIT_BRANCH: ${{ github.ref_name }}

jobs:
  test-rust:
    name: test:rust
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      SUBSTRATE_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-
      - run: rustup component add clippy
      - run: cargo clippy --all-targets -- -D warnings
      # The relay tests use a fake herdr; the server suite needs only Postgres.
      - run: cargo test -p substrate-proto -p substrate-server

  build-production:
    name: build:production
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ci/install-pl.sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pl up --production --hold
        env: { PUSHLEFT_TOKEN: "${{ secrets.PUSHLEFT_TOKEN }}" }

  deploy-production:
    name: deploy:production
    needs: [build-production, test-rust]
    concurrency: { group: pushleft-production }
    environment:
      name: production
      url: https://substrate.gliph.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ci/install-pl.sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pl release --production --commit "$GITHUB_SHA"
        env: { PUSHLEFT_TOKEN: "${{ secrets.PUSHLEFT_TOKEN }}" }
      - run: curl -fsS https://substrate.gliph.sh/healthz
