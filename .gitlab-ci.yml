# CI/CD for Substrate (git.erip.me/gliph/substrate). Every push is tested;
# main deploys to Pushleft (org empire, project substrate) from .pl.yaml.
# Needs the protected, masked CI variable PUSHLEFT_TOKEN (an empire service token).

stages: [test, deploy]

test:
  stage: test
  image: rust:1.90
  services:
    - name: postgres:17
      alias: postgres
  variables:
    POSTGRES_PASSWORD: postgres
    SUBSTRATE_TEST_PG: postgres://postgres:postgres@postgres:5432/postgres
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  cache:
    key: cargo
    paths: [.cargo/registry, target]
  script:
    - rustup component add clippy
    - cargo clippy --all-targets -- -D warnings
    # The relay tests use a fake herdr; the server suite needs only Postgres.
    - cargo test -p substrate-proto -p substrate-server

deploy:
  stage: deploy
  image: buildpack-deps:bookworm-scm
  needs: [test]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  resource_group: substrate-prod
  environment:
    name: prod
    url: https://substrate.gliph.sh
  variables:
    PL_VERSION: 0.1.0-6e5dc8d
    PL_SHA256: 5961f84d5bed6cacdbe4af41f36708a0ca0600e00ff4e0c6935c6ffadcfaa92a
  script:
    # Pipelines can finish out of order: only the commit at the tip of main
    # deploys, so an older pipeline never rolls production back.
    - |
      tip=$(git ls-remote "$CI_REPOSITORY_URL" refs/heads/main | cut -f1)
      if [ "$tip" != "$CI_COMMIT_SHA" ]; then echo "main is at $tip; not deploying $CI_COMMIT_SHA"; exit 0; fi
    - curl -fsSL -o /usr/local/bin/pl "https://releases.pushleft.dev/cli/$PL_VERSION/pl-linux-amd64"
    - echo "$PL_SHA256  /usr/local/bin/pl" | sha256sum -c -
    - chmod +x /usr/local/bin/pl
    # The token names its org (empire); --org cannot be combined with it.
    - pl up --production
    - curl -fsS https://substrate.gliph.sh/healthz
